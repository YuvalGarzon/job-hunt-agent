name: tests

# Runs the test suite on every push and pull request. Every test runs as the made-up example
# user (examples/) with every outside service faked, so no keys or accounts are needed.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: System libraries for the PDF renderer (WeasyPrint)
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      - name: Install
        run: pip install -r requirements.txt
      - name: Test
        run: python -m pytest -q
